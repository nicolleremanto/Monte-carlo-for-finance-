name: interface web (GitHub Pages)

# Publie l'interface (app/) et la librairie (mcfin/) comme site statique :
# les calculs s'exécutent dans le navigateur via Pyodide (WebAssembly).
# Prérequis unique : Settings → Pages → Source = « GitHub Actions ».

on:
  push:
    paths: ["app/**", "mcfin/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages est-il activé ?
        id: check
        env:
          TOKEN: ${{ github.token }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          if [ "$code" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages n'est pas activé : Settings → Pages → Source = GitHub Actions, puis relancer ce workflow."
          fi
      - uses: actions/checkout@v5
        if: steps.check.outputs.enabled == 'true'
      - uses: actions/setup-python@v6
        if: steps.check.outputs.enabled == 'true'
        with:
          python-version: "3.12"
      - name: Assemblage du site
        if: steps.check.outputs.enabled == 'true'
        run: |
          python app/make_manifest.py
          mkdir -p _site
          cp -r app mcfin _site/
          find _site -name "__pycache__" -prune -exec rm -rf {} +
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=app/"><a href="app/">Interface mcfin</a>\n' > _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
        if: steps.check.outputs.enabled == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.check.outputs.enabled == 'true'
        with:
          path: _site
      - id: deployment
        if: steps.check.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
